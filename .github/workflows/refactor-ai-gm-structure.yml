name: Refactor handbook for AI GM routing

on:
  push:
    branches:
      - audit/ai-gm-handbook-structure
    paths:
      - .github/workflows/refactor-ai-gm-structure.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run structural refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/refactor_ai_gm_structure.py')
          s = p.read_text(encoding='utf-8')
          old = "dups = sorted((len(v[0]), sorted(v[1]), v[0]) for v in groups.values() if len(v[1]) > 1, reverse=True)"
          new = "dups = sorted(((len(v[0]), sorted(v[1]), v[0]) for v in groups.values() if len(v[1]) > 1), reverse=True)"
          if old not in s:
              raise SystemExit('expected syntax line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/refactor_ai_gm_structure.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: optimize handbook routing for AI GM"
          git push origin HEAD:audit/ai-gm-handbook-structure
