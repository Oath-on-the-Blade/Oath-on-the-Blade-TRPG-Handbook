name: Refactor handbook for AI GM routing

on:
  push:
    branches:
      - audit/ai-gm-handbook-structure
    paths:
      - .github/workflows/refactor-ai-gm-structure.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run structural refactor
        run: python .github/scripts/refactor_ai_gm_structure.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: optimize handbook routing for AI GM"
          git push origin HEAD:audit/ai-gm-handbook-structure
