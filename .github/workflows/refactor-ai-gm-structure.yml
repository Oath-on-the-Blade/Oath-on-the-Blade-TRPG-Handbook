name: Finalize AI GM handbook structure

on:
  push:
    branches:
      - audit/ai-gm-handbook-structure
    paths:
      - .github/workflows/refactor-ai-gm-structure.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and finalize structure
        run: python .github/scripts/finalize_ai_gm_structure.py
      - name: Commit final structure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audit: finalize AI GM handbook structure"
          git push origin HEAD:audit/ai-gm-handbook-structure
