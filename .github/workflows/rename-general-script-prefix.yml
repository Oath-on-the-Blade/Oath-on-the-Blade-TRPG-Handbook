name: Temporary general task prefix migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-general-script-prefix.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace old general filename prefix in rules
        shell: bash
        run: |
          set -euo pipefail
          git grep -Il -z 'OOTB_劇本_' -- '*.md' | xargs -0 -r sed -i 's/OOTB_劇本_/OOTB_任務_/g'
          rm -f .github/workflows/rename-general-script-prefix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Rename general script filename prefix to task'
          git push origin HEAD:main
