name: Normalize stable list formatting

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-list-numbering.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore rule sections and normalize catalogue numbering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          BASE = 'cfd4dcf639aef6bb74a4a19879b9c877d731a609'

          # Use NUL-separated paths so Git never quote-escapes Chinese filenames.
          raw = subprocess.check_output(['git', 'ls-tree', '-rz', '--name-only', BASE])
          md_paths = [p.decode('utf-8') for p in raw.split(b'\0') if p and p.decode('utf-8').endswith('.md')]
          for i in range(0, len(md_paths), 100):
              subprocess.run(['git', 'checkout', BASE, '--', *md_paths[i:i+100]], check=True)

          heading_re = re.compile(
              r'^(#{1,6})([ \t]+)(?:(?:\d+(?:\.\d+)+)|(?:\d+[.)、])|(?:[一二三四五六七八九十百千]+[、.]))[ \t]*(.+?)\s*$'
          )
          ordered_re = re.compile(r'^(\s*)\d+\.\s+(.*)$')
          numeric_section_ref = re.compile(r'第\s*\d+(?:\.\d+)*\s*節')

          changed = set()

          def write_if_changed(path: Path, original: str, lines):
              text = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.add(path.as_posix())

          def strip_heading_ordinals(path_str: str, safety_check=True):
              path = Path(path_str)
              original = path.read_text(encoding='utf-8')
              if safety_check and numeric_section_ref.search(original):
                  print(f'SKIP numbered-heading normalization (internal numeric section reference): {path_str}')
                  return
              lines = []
              for line in original.splitlines():
                  m = heading_re.match(line)
                  if m:
                      line = f'{m.group(1)}{m.group(2)}{m.group(3)}'
                  lines.append(line)
              write_if_changed(path, original, lines)

          def ordered_to_bullets(path_str: str):
              path = Path(path_str)
              original = path.read_text(encoding='utf-8')
              lines = []
              for line in original.splitlines():
                  m = ordered_re.match(line)
                  if m:
                      line = f'{m.group(1)}- {m.group(2)}'
                  lines.append(line)
              write_if_changed(path, original, lines)

          # Feat catalogue: entry numbers and tier ordinals are presentation-only.
          strip_heading_ordinals('內容庫/高等絕活.md', safety_check=False)

          # Registry/catalogue: section and sub-section ordinals are not stable IDs.
          strip_heading_ordinals('內容庫/相對名譽對象.md', safety_check=False)
          ordered_to_bullets('內容庫/相對名譽對象.md')

          # Pure indexes / formatting enumerations do not need ordered-list syntax.
          ordered_to_bullets('內容庫/README.md')
          ordered_to_bullets('世界知識庫/README.md')

          # World-knowledge catalogue files may drop heading ordinals when they do not
          # internally rely on numeric section references.
          catalogue_files = [
              '世界知識庫/人物/江湖人物與武學源流.md',
              '世界知識庫/勢力/商會鏢局與幫會.md',
              '世界知識庫/勢力/門派.md',
              '世界知識庫/地理/昊國地理.md',
              '世界知識庫/政權/朝廷與官府.md',
              '世界知識庫/政權/朝野派系.md',
              '世界知識庫/歷史/年表與關係.md',
              '世界知識庫/江湖/綠林黑道與神秘人.md',
              '世界知識庫/社會/商賈文壇與百業.md',
          ]
          for p in catalogue_files:
              strip_heading_ordinals(p, safety_check=True)

          # Repository-wide convention so future insertions do not reintroduce diff churn.
          readme = Path('README.md')
          original = readme.read_text(encoding='utf-8')
          marker = '## Markdown 編排原則'
          if marker not in original:
              addition = (
                  '\n## Markdown 編排原則\n\n'
                  '- 純枚舉、目錄與可獨立插入的條目，使用項目符號或穩定名稱標題，不使用會因中途插入而令後續全部順延的序號。只有順序本身具有流程、優先級、階段或規則機械意義時，才使用數字序號；等級、DC、次數、距離、資源等規則數值不受此限制。\n'
              )
              anchor = '\n## 其他\n'
              new = original.replace(anchor, addition + anchor, 1) if anchor in original else original + addition
              readme.write_text(new, encoding='utf-8')
              changed.add('README.md')

          print('FINAL NORMALIZED FILES')
          for p in sorted(changed):
              print(p)

          print('\nNUMBERED HEADINGS REMAINING IN HIGH-LEVEL FEATS')
          for lineno, line in enumerate(Path('內容庫/高等絕活.md').read_text(encoding='utf-8').splitlines(), 1):
              if heading_re.match(line):
                  print(f'{lineno}:{line}')

          print('\nORDERED MARKERS REMAINING IN PURE INDEX/REGISTRY FILES')
          for p in ['內容庫/README.md', '內容庫/相對名譽對象.md', '世界知識庫/README.md']:
              for lineno, line in enumerate(Path(p).read_text(encoding='utf-8').splitlines(), 1):
                  if ordered_re.match(line):
                      print(f'{p}:{lineno}:{line}')

          print('\nRULE SECTION RESTORATION CHECK')
          for p in ['GM規則/遊戲流程.md', 'GM規則/結算.md', '劇本設計規則/設計.md', '遊玩規則/角色/高等成長.md']:
              first_numbered = next((line for line in Path(p).read_text(encoding='utf-8').splitlines() if heading_re.match(line)), None)
              print(f'{p}: {first_numbered}')
          PY

      - name: Commit refined normalization
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md' '**/*.md'
          git commit -m "docs: stabilize catalogue numbering"
          git push origin HEAD:main
